version: '3'

services:
  app1:
    container_name: Api1
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE}
  app2:
    container_name: Api2
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE}
  app3:
    container_name: Api3
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE}
    
  db:
    container_name: Postgres
    image: postgres:15.3-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data: